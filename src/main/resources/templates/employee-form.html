<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id} != 0 ? 'Upraviť zamestnanca' : 'Pridať zamestnanca'">Pridať zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .form-control {
            background-color: #2c2c2c;
            border-color: #444444;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #2c2c2c;
            border-color: #0d6efd;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .form-select {
            background-color: #2c2c2c;
            border-color: #444444;
            color: #ffffff;
        }
        .form-select:focus {
            background-color: #2c2c2c;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .form-check-input {
            background-color: #2c2c2c;
            border-color: #444444;
        }
        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5c636a;
            border-color: #565e64;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 2rem;
            background-color: #1e1e1e;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body data-bs-theme="dark">
<div class="container mt-4">
    <h2 th:text="${employee.id} != 0 ? 'Upraviť zamestnanca' : 'Pridať zamestnanca'">Pridať zamestnanca</h2>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <!-- скрытое ID для UPDATE -->
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="firstName" class="form-label">Krstné meno</label>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}">
            <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Priezvisko</label>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}">
            <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}">
            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Telefón</label>
            <input type="text" class="form-control" id="phone" th:field="*{phone}">
            <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label for="birthDate" class="form-label">Dátum narodenia</label>
            <input type="date" class="form-control" id="birthDate" th:field="*{birth_date}">
            <div class="text-danger" th:if="${#fields.hasErrors('birth_date')}" th:errors="*{birth_date}"></div>
        </div>

        <div class="mb-3">
            <label for="jobTitle" class="form-label">Pracovná pozícia</label>
            <select class="form-select" id="jobTitle" th:field="*{job_title}">
                <option th:each="title : ${jobTitles}"
                        th:value="${title}"
                        th:text="${title}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('job_title')}" th:errors="*{job_title}"></div>
        </div>

        <div class="mb-3">
            <label for="salary" class="form-label">Plat</label>
            <input type="number" step="0.01" class="form-control" id="salary" th:field="*{salary}">
            <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Typ zamestnania</label>
            <div class="form-check" th:each="type, typeStat : ${employmentTypes}">
                <input class="form-check-input" type="radio"
                       th:field="*{full_time}" th:value="${type}"
                       th:id="${'type' + typeStat.index}">
                <label class="form-check-label"
                       th:for="${'type' + typeStat.index}"
                       th:text="${type}">
                </label>
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('full_time')}" th:errors="*{full_time}"></div>
        </div>

        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary me-2"
                    th:text="${employee.id} != 0 ? 'Uložiť zmeny' : 'Uložiť'">Uložiť</button>
            <a th:href="@{/}" class="btn btn-secondary">Zrušiť</a>
        </div>
    </form>
</div>
</body>
</html>
