<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Zamestnanci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 900px;
            margin: auto;
            padding: 2rem;
            background-color: #1e1e1e;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .table {
            color: #ffffff;
        }
        .table thead th {
            background-color: #2c2c2c;
            border-color: #444444;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #2c2c2c;
        }
        .table-striped tbody tr:nth-of-type(even) {
            background-color: #1e1e1e;
        }
        .table td, .table th {
            border-color: #444444;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
        }
        a {
            color: #0d6efd;
            text-decoration: none;
        }
        a:hover {
            color: #0b5ed7;
            text-decoration: underline;
        }
    </style>
</head>
<body data-bs-theme="dark">
<div class="container mt-4">
    <h2>Zoznam zamestnancov</h2>
    <a th:href="@{/employees/new}" class="btn btn-primary mb-3">Pridať zamestnanca</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Meno</th>
            <th>Email</th>
            <th>Pracovná pozícia</th>
            <th>Akcie</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td>
                <a th:href="@{/employees/{id}(id=${employee.id})}"
                   th:text="${employee.firstName + ' ' + employee.lastName}">
                </a>
            </td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.job_title}"></td>
            <td>
                <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Ste si istý?')">Odstrániť</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
