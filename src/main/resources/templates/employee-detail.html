<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Detail zamestnanca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 2rem;
            background-color: #1e1e1e;
            border-radius: 0.5rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }
        .card {
            background-color: #2c2c2c;
            border-color: #444444;
        }
        .card-title {
            color: #ffffff;
        }
        .card-text {
            color: #ffffff;
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
    </style>
</head>
<body data-bs-theme="dark">
<div class="container mt-4">
    <h2>Detaily zamestnanca</h2>
    <div class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${employee.firstName + ' ' + employee.lastName}"></h5>
            <p class="card-text">
                <strong>Email:</strong> <span th:text="${employee.email}"></span><br>
                <strong>Telefón:</strong> <span th:text="${employee.phone}"></span><br>
                <strong>Dátum narodenia:</strong> <span th:text="${employee.birth_date}"></span><br>
                <strong>Pracovná pozícia:</strong> <span th:text="${employee.job_title}"></span><br>
                <strong>Plat:</strong> <span th:text="${employee.salary}"></span><br>
                <strong>Typ zamestnania:</strong> <span th:text="${employee.full_time}"></span>            </p>
        </div>
    </div>
    <a th:href="@{/}" class="btn btn-primary mt-3">Späť na zoznam</a>
</div>
</body>
</html>
